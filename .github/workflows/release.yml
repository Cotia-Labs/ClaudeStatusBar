name: Release

# Dispara ao empurrar uma tag v* (ex.: v1.0.0) ou manualmente pela aba Actions.
# Em ambos os casos o DMG universal vira artefato baixável; com tag, ele também
# é anexado à Release do GitHub.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build universal .app + DMG
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Selecionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Conferir versão contra a tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          file_version="$(tr -d '[:space:]' < VERSION)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$file_version" != "$tag_version" ]; then
            echo "VERSION ($file_version) difere da tag ($tag_version)" >&2
            exit 1
          fi

      - name: Importar certificado Developer ID (opcional)
        env:
          CERT_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          # O contexto `secrets` não existe em `if:`, então o pulo é aqui dentro.
          if [ -z "$CERT_P12" ]; then
            echo "Sem certificado nos secrets; o build sairá ad-hoc."
            exit 0
          fi
          # Keychain temporária só para este runner; some junto com a VM.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build
        run: ./build-app.sh --universal --dmg
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}

      - name: Verificar o bundle
        run: |
          app="dist/ClaudeStatusBar.app"
          lipo -archs "$app/Contents/MacOS/ClaudeStatusBar" | grep -q arm64
          lipo -archs "$app/Contents/MacOS/ClaudeStatusBar" | grep -q x86_64
          codesign --verify --strict "$app"
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$app/Contents/Info.plist"

      - name: Subir artefato
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeStatusBar-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Anexar à Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
          body: |
            Baixe o `.dmg`, arraste **ClaudeStatusBar.app** para Applications.

            O app é assinado só ad-hoc (sem conta de desenvolvedor), então na
            primeira abertura use **botão direito → Abrir**, ou rode:

            ```bash
            xattr -dr com.apple.quarantine /Applications/ClaudeStatusBar.app
            ```

            Requer macOS 13+ e login ativo do Claude Code (`claude auth`).
