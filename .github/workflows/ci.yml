name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build e empacotamento
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Selecionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build (debug)
        run: swift build -v

      - name: Empacotar .app
        run: ./build-app.sh

      - name: Conferir o bundle
        run: |
          app="dist/ClaudeStatusBar.app"
          test -x "$app/Contents/MacOS/ClaudeStatusBar"
          codesign --verify --strict "$app"
          plutil -lint "$app/Contents/Info.plist"

      - name: Conferir as traduções
        # Toda chave usada em L("…") precisa existir nos dois .lproj.
        run: |
          grep -ohE 'L\("([^"\\]|\\.)*"' Sources/ClaudeStatusBar/*.swift \
            | sed 's/^L("//; s/"$//' | sort -u > /tmp/keys.txt
          status=0
          for lang in en pt-BR; do
            plutil -lint "Resources/$lang.lproj/Localizable.strings"
            while IFS= read -r key; do
              grep -qF "\"$key\" = " "Resources/$lang.lproj/Localizable.strings" \
                || { echo "$lang: falta a chave: $key"; status=1; }
            done < /tmp/keys.txt
          done
          exit $status

      - name: Smoke test do --dump
        # Sem credenciais no runner, o esperado é a mensagem de token ausente:
        # o que se testa aqui é que o binário roda e sai limpo.
        run: |
          output="$(./dist/ClaudeStatusBar.app/Contents/MacOS/ClaudeStatusBar --dump)"
          echo "$output"
          echo "$output" | grep -qE "Error:|Erro:"
